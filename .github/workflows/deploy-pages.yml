name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manually triggering a deploy from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between an
# in-progress run and the latest queued one.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This is a static site with no build step — publish the repo
          # root as-is (backup_pre_redesign/ is excluded via .gitignore
          # and never enters the repo in the first place).
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
